# Local Langfuse (self-hosted) for tracing, cost and scores.
#
# Based on the official file at
# https://github.com/langfuse/langfuse/blob/main/docker-compose.yml (fetched 20 Nov 2026),
# trimmed to what we need:
#   - the optional AI gateway service is removed;
#   - every password and key comes from .env. There are no fallback values, so if a
#     secret is missing, compose stops with an error instead of starting with a weak default;
#   - only langfuse-web is published to the host (127.0.0.1:3000). Every other service
#     is reachable only inside the Docker network, by service name (postgres, redis...);
#   - telemetry to Langfuse is off by default.
#
# First time:   uv run python scripts/generate_secrets.py
# Start:        docker compose up -d
# Stop:         docker compose down          (data is kept in Docker volumes)
# Wipe data:    docker compose down -v
#
# Open the UI at http://localhost:3000

services:
  langfuse-worker:
    # Background worker: takes queued trace events and writes them to ClickHouse.
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4}
    restart: always
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    # No host port: the worker only pulls jobs from Redis; nothing on Windows calls it.
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run scripts/generate_secrets.py}@postgres:5432/postgres
      SALT: ${SALT:?SALT is not set. Run scripts/generate_secrets.py}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is not set. Run scripts/generate_secrets.py}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is not set. Run scripts/generate_secrets.py}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is not set. Run scripts/generate_secrets.py}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is not set. Run scripts/generate_secrets.py}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH:?REDIS_AUTH is not set. Run scripts/generate_secrets.py}
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    # The website and API: the UI you open, and the endpoint the Python SDK sends traces to.
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4}
    restart: always
    depends_on: *langfuse-depends-on
    ports:
      - 127.0.0.1:3000:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is not set. Run scripts/generate_secrets.py}
      # The browser uploads media straight to MinIO, so it needs the host address.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000

  clickhouse:
    # Analytics database: stores traces and observations, fast for big queries and dashboards.
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is not set. Run scripts/generate_secrets.py}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    # No host port: only langfuse-web and langfuse-worker query it, over the Docker network.
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    # File storage (S3-compatible): keeps raw incoming events and media before processing.
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    # Create the 'langfuse' bucket before starting the server.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is not set. Run scripts/generate_secrets.py}
    # No host port. Trace events reach MinIO through langfuse-web, inside Docker.
    # The host would only need it for media uploads (images, audio, PDFs attached to
    # traces), which this project does not send. To enable them later, add:
    #   ports: ["127.0.0.1:9090:9000"]
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    # Queue and cache: holds the list of jobs waiting for the worker.
    image: docker.io/redis:7
    restart: always
    command: >
      --requirepass ${REDIS_AUTH:?REDIS_AUTH is not set. Run scripts/generate_secrets.py}
      --maxmemory-policy noeviction
    # No host port: only the Langfuse containers use the queue.
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    # Main database: users, projects, API keys, settings, scores.
    image: docker.io/postgres:17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run scripts/generate_secrets.py}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    # No host port: only the Langfuse containers connect. This also avoids clashes with
    # Windows reserved port ranges or a local Postgres on 5432.
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
