[project]
name = "clewline"
version = "0.1.0"
description = "Governed agentic casework engine: AI reads and checks, a human decides."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
    "langchain-openai>=1.8.5",
    "langfuse>=5.2.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Plain `uv run pytest` runs only fast, offline unit tests.
# Select the others explicitly with -m live or -m eval.
addopts = '-m "not live and not eval"'
markers = [
    "live: makes real model API calls (needs keys in .env)",
    "eval: runs a step against the full test set and writes a report",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
